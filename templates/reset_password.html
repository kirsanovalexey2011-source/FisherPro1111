{% extends "base.html" %}
{% block title %}Новый пароль — ФишЭксперт{% endblock %}
{% block content %}
<section class="fe-auth-wrap">
  <div class="fe-auth-card">
    <div class="fe-auth-mark"><i class="fa-solid fa-lock"></i></div>
    <p class="fe-eyebrow">Безопасность аккаунта</p>
    <h1>Задайте новый пароль</h1>
    <p class="fe-muted">Пароль должен содержать от 10 до 1024 символов.</p>
    <form method="post" class="fe-auth-form">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label>Новый пароль<input class="fe-input" type="password" name="password" minlength="10" maxlength="1024" autocomplete="new-password" required></label>
      <label>Повторите пароль<input class="fe-input" type="password" name="password_confirmation" minlength="10" maxlength="1024" autocomplete="new-password" required></label>
      <button class="fe-button w-full" type="submit">Сохранить новый пароль</button>
    </form>
  </div>
</section>
{% endblock %}
