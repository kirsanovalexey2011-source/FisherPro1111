{% extends "base.html" %}
{% block title %}Восстановление пароля — ФишЭксперт{% endblock %}
{% block content %}
<section class="fe-auth-wrap">
  <div class="fe-auth-card">
    <div class="fe-auth-mark"><i class="fa-solid fa-envelope"></i></div>
    <p class="fe-eyebrow">Безопасность аккаунта</p>
    <h1>Восстановить пароль</h1>
    <p class="fe-muted">Укажите email, привязанный к аккаунту. Если он существует, мы отправим ссылку для смены пароля.</p>
    <form method="post" class="fe-auth-form">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label>Email<input class="fe-input" type="email" name="email" maxlength="120" autocomplete="email" required></label>
      <button class="fe-button w-full" type="submit">Отправить ссылку</button>
    </form>
    <p class="fe-auth-switch"><a href="{{ url_for('login') }}">Вернуться ко входу</a></p>
  </div>
</section>
{% endblock %}
